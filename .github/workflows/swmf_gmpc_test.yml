name: SWMF GM-PC Integration Test

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - '!src/main.cpp'
      - '!src/Converter.cpp'
      - 'srcInterface/**'
      - 'include/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/swmf_gmpc_test.yml'
      - '.github/actions/setup-swmf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          # GM-PC runs both 2D (test16_2d, test23_2d) and 3D (the rest) AMReX
          # builds, so the AMReX cache key encodes both dimensions.
          amrex-cache-suffix: 2d3d
          config-components: PC/FLEKS,GM/BATSRUS,IE/Ridley_serial,IM/RCM2
          verify-amrex: 'true'

      - name: Build and Run test16_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_2d

      - name: Build and Run test16_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_3d

      - name: Build and Run test17
        working-directory: SWMF
        run: |
          make -j$(nproc) test17

      - name: Build and Run test17_hybrid
        working-directory: SWMF
        run: |
          make -j$(nproc) test17_hybrid

      - name: Build and Run test18
        working-directory: SWMF
        run: |
          make -j$(nproc) test18

      - name: Build and Run test23_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_2d

      - name: Build and Run test23_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_3d

      - name: Build and Run test25
        working-directory: SWMF
        run: |
          make -j$(nproc) test25

      - name: Build and Run test_swpc_aepic
        working-directory: SWMF
        run: |
          make -j$(nproc) test_swpc_aepic

      - name: Validate PARAM files (CheckParam.pl -F -c=PC)
        working-directory: SWMF
        run: |
          # Check only the PC (FLEKS) component sections of every FLEKS-coupled
          # PARAM file against FLEKS's own PARAM.XML.  Using -c=PC means CheckParam
          # only parses #BEGIN_COMP PC ... #END_COMP PC blocks, so it is insensitive
          # to GM equation modules, grid sizes, or IE/IM settings that vary per test
          # and are already exercised by the overnight SWMF regression suite.
          #
          # CheckParam.pl's exit code is not reliable here: its param_error() sets
          # $IsError=1 even when the message is suppressed during multi-part
          # "strings" parameter matching (e.g. #SAVEPLOT's StringPlot). We therefore
          # follow SWMF's Scripts/TestParam.pl criterion: only reported output is an error.
          #
          # Using -F also validates and enforces formatting (alignments/tabulation/case)
          # identical to Scripts/TestParam.pl -F.
          #
          # Restart decks (such as PARAM.in.test.GMPC.FLEKS.2D.restart) require
          # runtime restart headers generated by Restart.pl and are already validated
          # by TestParam.pl during test17 execution.
          CHECK="share/Scripts/CheckParam.pl"
          XML="PC/FLEKS/PARAM.XML"
          FAILED=0

          check_pc() {
            local ndim="$1"
            local f="$2"
            echo "Checking PC section of $f (nDim=$ndim) ..."
            local check_output
            check_output=$("$CHECK" -F -c=PC -x="$XML" -s="nDim:$ndim" "$f" 2>&1 || true)
            if [ -n "$check_output" ]; then
              printf '%s\n' "$check_output"
              echo "::error::PC PARAM validity check failed for $f"
              FAILED=1
            fi
            rm -f "${f}_orig_"
          }

          for param_file in \
            Param/PARAM.in.test.GMPC.FLEKS.periodic \
            Param/PARAM.in.test.GMPC.FLEKS.2D.2steps \
            Param/PARAM.in.test.GMPC.FLEKS.2D.4steps \
            Param/PARAM.in.test.GMPC.FLEKS.2D.adapt \
            Param/PARAM.in.test.GMPC.FLEKS.2D.hybrid \
            Param/PARAM.in.test.GMPC.FLEKS.2D.hybrid.adapt \
            Param/PARAM.in.test.GMPC.FLEKS.3D \
            Param/PARAM.in.test.GMPC.FLEKS.AMR.FASTWAVE.3D \
            Param/PARAM.in.test.FLEKS.AMR.LightWave.3D \
            Param/SWPC/PARAM.in_aepic_init; do
            check_pc 3 "$param_file"
          done

          # 2D AMReX test uses nDim=2
          check_pc 2 Param/PARAM.in.test.GMPC.FLEKS.AMR.FASTWAVE.2D

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Verify Test Results
        working-directory: SWMF
        run: |
          DIFF_FILES=(
            test16_2d_gmpc.diff
            test16_3d_gmpc.diff
            test17_gmpc.diff
            test17_hybrid_gmpc.diff
            test18_gmpc.diff
            test23_2d_gmpc.diff
            test23_3d_gmpc.diff
            test25_gmpc.diff
            test_swpc_aepic_gm.diff
            test_swpc_aepic_pc.diff
          )

          test_name_for() {
            case "$1" in
              test_swpc_aepic_gm.diff) echo "test_swpc_aepic (GM)" ;;
              test_swpc_aepic_pc.diff) echo "test_swpc_aepic (PC)" ;;
              *_gmpc.diff)             echo "${1%_gmpc.diff}" ;;
              *)                       echo "${1%.diff}" ;;
            esac
          }

          FAILED=0
          PASSED_COUNT=0
          FAILED_COUNT=0
          FAILED_ROWS=""
          ALL_ROWS=""
          DIFF_DETAILS=""

          for diff_file in "${DIFF_FILES[@]}"; do
            test_name=$(test_name_for "$diff_file")
            if [ ! -f "$diff_file" ]; then
              echo "::error::Test verification failed! Expected diff file $diff_file was not generated."
              FAILED=1
              FAILED_COUNT=$((FAILED_COUNT + 1))
              reason="Expected diff file not generated"
              FAILED_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
            elif [ -s "$diff_file" ]; then
              echo "::error::Test verification failed! Non-zero diff detected in $diff_file"
              cat "$diff_file"
              FAILED=1
              FAILED_COUNT=$((FAILED_COUNT + 1))
              last_line=$(tail -n 1 "$diff_file" | tr -d '\r')
              if [[ "$last_line" =~ _compile\.\.\.$ ]] || [[ "$last_line" =~ _rundir\.\.\.$ ]] || [[ "$last_line" =~ _run\.\.\.$ ]] || [[ "$last_line" =~ _check\.\.\.$ ]]; then
                reason="Aborted during \`${last_line%...}\`"
              else
                err_summary=$(grep -E "ERROR in DiffNum\.pl:" "$diff_file" | sed 's/ERROR in DiffNum\.pl: //' | paste -sd "; " - || true)
                if [ -n "$err_summary" ]; then
                  reason="$err_summary"
                else
                  reason="Non-zero diff ($(wc -l < "$diff_file" | tr -d ' ') lines)"
                fi
              fi
              FAILED_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              DIFF_DETAILS+="<details><summary>📄 <code>$diff_file</code> ($test_name)</summary>\n\n\`\`\`diff\n$(cat "$diff_file")\n\`\`\`\n\n</details>\n\n"
            else
              echo "Test verification successful for $diff_file! Diff is empty."
              PASSED_COUNT=$((PASSED_COUNT + 1))
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🟢 **PASSED** | - |\n"
            fi
          done

          TOTAL_COUNT=${#DIFF_FILES[@]}
          {
            echo "### 🧪 SWMF GM-PC Integration Test Results"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "✅ **All $TOTAL_COUNT checks passed!**"
            else
              echo "❌ **$FAILED_COUNT of $TOTAL_COUNT check(s) failed** (**$PASSED_COUNT** passed, **$FAILED_COUNT** failed)"
              echo ""
              echo "#### 🔴 Failed Checks"
              echo ""
              echo "| Test | Diff File | Status | Details |"
              echo "| :--- | :--- | :--- | :--- |"
              printf '%b' "$FAILED_ROWS"
              echo ""
              if [ -n "$DIFF_DETAILS" ]; then
                echo "#### 🔍 Diff Output for Failed Checks"
                echo ""
                printf '%b' "$DIFF_DETAILS"
              fi
            fi
            echo ""
            echo "<details>"
            echo "<summary>📋 <b>Full Check Results ($TOTAL_COUNT checks)</b></summary>"
            echo ""
            echo "| Test | Diff File | Status | Details |"
            echo "| :--- | :--- | :--- | :--- |"
            printf '%b' "$ALL_ROWS"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

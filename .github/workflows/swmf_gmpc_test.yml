name: SWMF GM-PC Integration Test

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - '!src/main.cpp'
      - '!src/Converter.cpp'
      - 'srcInterface/**'
      - 'include/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/swmf_gmpc_test.yml'
      - '.github/actions/setup-swmf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          # GM-PC runs both 2D (test16_2d, test23_2d) and 3D (the rest) AMReX
          # builds, so the AMReX cache key encodes both dimensions.
          amrex-cache-suffix: 2d3d
          config-components: PC/FLEKS,GM/BATSRUS,IE/Ridley_serial,IM/RCM2
          verify-amrex: 'true'

      - name: Build and Run test16_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_2d

      - name: Build and Run test16_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_3d

      - name: Build and Run test17
        working-directory: SWMF
        run: |
          make -j$(nproc) test17

      - name: Build and Run test18
        working-directory: SWMF
        run: |
          make -j$(nproc) test18

      - name: Build and Run test23_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_2d

      - name: Build and Run test23_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_3d

      - name: Build and Run test25
        working-directory: SWMF
        run: |
          make -j$(nproc) test25

      - name: Build and Run test_swpc_aepic
        working-directory: SWMF
        run: |
          make -j$(nproc) test_swpc_aepic

      - name: Validate PARAM files (TestParam.pl)
        working-directory: SWMF
        run: |
          # Run TestParam.pl without the Makefile '-' suppression prefix so that
          # any parameter-validity error in a FLEKS-coupled PARAM deck fails CI.
          # Each call re-reads Config.pl, so we ensure the final SWMF config
          # (GM+PC, the last thing compiled) is active when we check.
          #
          # Re-configure to the standard GM+PC setup before running the checks.
          ./Config.pl -default -amrex -v=Empty,PC/FLEKS,GM/BATSRUS
          ./Config.pl -o=GM:u=Default,e=MultiIonPe,ng=2,g=8,8,1 -o=PC:lev=9

          FAILED=0
          for param_file in \
            Param/PARAM.in.test.GMPC.FLEKS.periodic \
            Param/PARAM.in.test.GMPC.FLEKS.2D.2steps \
            Param/PARAM.in.test.GMPC.FLEKS.2D.4steps \
            Param/PARAM.in.test.GMPC.FLEKS.2D.adapt \
            Param/PARAM.in.test.GMPC.FLEKS.2D.restart \
            Param/PARAM.in.test.GMPC.FLEKS.3D \
            Param/PARAM.in.test.GMPC.FLEKS.AMR.FASTWAVE.2D \
            Param/PARAM.in.test.GMPC.FLEKS.AMR.FASTWAVE.3D \
            Param/PARAM.in.test.FLEKS.AMR.LightWave.3D; do
            echo "Checking $param_file ..."
            if ! Scripts/TestParam.pl "$param_file"; then
              echo "::error::PARAM validity check failed for $param_file"
              FAILED=1
            fi
          done

          # Check the SWPC AEPIC PARAM file with the GM+IE+IM+PC configuration.
          ./Config.pl -default -amrex
          ./Config.pl -v=Empty,GM/BATSRUS,IE/Ridley_serial,IM/RCM2,PC/FLEKS
          ./Config.pl -o=GM:u=Default,e=Mhd,ng=2,g=8,8,8,IE:g=91,181
          if ! Scripts/TestParam.pl Param/SWPC/PARAM.in_aepic_init; then
            echo "::error::PARAM validity check failed for Param/SWPC/PARAM.in_aepic_init"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Verify Test Results
        working-directory: SWMF
        run: |
          FAILED=0
          for diff_file in test16_2d_gmpc.diff test16_3d_gmpc.diff \
                           test17_gmpc.diff test18_gmpc.diff \
                           test23_2d_gmpc.diff test23_3d_gmpc.diff \
                           test25_gmpc.diff \
                           test_swpc_aepic_gm.diff test_swpc_aepic_pc.diff; do
            if [ -s "$diff_file" ]; then
              echo "::error::Test verification failed! Non-zero diff detected in $diff_file"
              cat "$diff_file"
              FAILED=1
            else
              echo "Test verification successful for $diff_file! Diff is empty."
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

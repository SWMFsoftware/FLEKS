name: SWMF OH-PT Integration Test

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - '!src/main.cpp'
      - '!src/Converter.cpp'
      - 'srcInterface/**'
      - 'include/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/swmf_ohpt_test.yml'
      - '.github/actions/setup-swmf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PT/FLEKS
          fleks-cache-exclude: PT/FLEKS
          # OH-PT runs the 3D AMReX build only (-amrex3d via -default), so the
          # AMReX cache key encodes the 3D dimension explicitly.
          amrex-cache-suffix: 3d
          config-components: OH/BATSRUS,PT/FLEKS
          # OH-PT configures PT/FLEKS (no PC component), so no "-o=PC:..." flag.
          config-extra: ''
          verify-amrex: 'true'

      - name: Build and Run test20
        working-directory: SWMF
        run: |
          make -j$(nproc) test20

      - name: Build and Run test21
        working-directory: SWMF
        run: |
          make -j$(nproc) test21

      - name: Build and Run test22
        working-directory: SWMF
        run: |
          make -j$(nproc) test22

      - name: Validate PARAM files (TestParam.pl)
        working-directory: SWMF
        run: |
          # Run TestParam.pl without the Makefile '-' suppression prefix so that
          # any parameter-validity error in a FLEKS-coupled PARAM deck fails CI.
          # Re-configure to the OH+PT setup before running the checks.
          ./Config.pl -default -v=Empty,OH/BATSRUS,PT/FLEKS
          ./Config.pl -o=OH:u=OuterHelio,e=SwhPui,ng=2,g=4,4,4 -o=PT:lev=5

          FAILED=0
          for param_file in \
            Param/PARAM.in.test.OHPT.FLEKS.shocktube \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.4neu.start \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.4neu.couple \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.swh \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.pui.4neu.start \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.pui.4neu.couple \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.swhpui; do
            echo "Checking $param_file ..."
            if ! Scripts/TestParam.pl "$param_file"; then
              echo "::error::PARAM validity check failed for $param_file"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Verify Test Results
        working-directory: SWMF
        run: |
          FAILED=0
          for diff_file in test20_ohpt.diff test21_oh_pt.diff test22_ohpt.diff; do
            if [ -s "$diff_file" ]; then
              echo "::error::Test verification failed! Non-zero diff detected in $diff_file"
              cat "$diff_file"
              FAILED=1
            else
              echo "Test verification successful for $diff_file! Diff is empty."
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

name: SWMF OH-PT Integration Test

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - '!src/main.cpp'
      - '!src/Converter.cpp'
      - 'srcInterface/**'
      - 'include/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/swmf_ohpt_test.yml'
      - '.github/actions/setup-swmf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PT/FLEKS
          fleks-cache-exclude: PT/FLEKS
          # OH-PT runs the 3D AMReX build only (-amrex3d via -default), so the
          # AMReX cache key encodes the 3D dimension explicitly.
          amrex-cache-suffix: 3d
          config-components: OH/BATSRUS,PT/FLEKS
          # OH-PT configures PT/FLEKS (no PC component), so no "-o=PC:..." flag.
          config-extra: ''
          verify-amrex: 'true'

      - name: Build and Run test20
        working-directory: SWMF
        run: |
          make -j$(nproc) test20

      - name: Build and Run test21
        working-directory: SWMF
        run: |
          make -j$(nproc) test21

      - name: Build and Run test22
        working-directory: SWMF
        run: |
          make -j$(nproc) test22

      - name: Validate PARAM files (CheckParam.pl -F -c=PT)
        working-directory: SWMF
        run: |
          # Check only the PT (FLEKS) component sections of FLEKS-coupled OH-PT
          # initial parameter files against FLEKS's own PARAM.XML.  Using -c=PT
          # means CheckParam only parses #BEGIN_COMP PT ... #END_COMP PT blocks,
          # so it is insensitive to OH equation modules or grid sizes that vary
          # per test and are already exercised by the overnight SWMF regression suite.
          #
          # CheckParam.pl's exit code is not reliable here: its param_error() sets
          # $IsError=1 even when the message is suppressed during multi-part
          # "strings" parameter matching (e.g. #SAVEPLOT's StringPlot). We therefore
          # follow SWMF's Scripts/TestParam.pl criterion: only reported output is an error.
          #
          # Using -F also validates and enforces formatting (alignments/tabulation/case)
          # identical to Scripts/TestParam.pl -F.
          #
          # Continuation/restart decks (couple, swh, swhpui) require runtime
          # restart headers generated by Restart.pl and are already validated
          # by TestParam.pl during test21/test22 execution.
          CHECK="share/Scripts/CheckParam.pl"
          XML="PT/FLEKS/PARAM.XML"
          FAILED=0

          check_pt() {
            local f="$1"
            echo "Checking PT section of $f ..."
            local check_output
            check_output=$("$CHECK" -F -c=PT -x="$XML" -s=nDim:3 "$f" 2>&1 || true)
            if [ -n "$check_output" ]; then
              printf '%s\n' "$check_output"
              echo "::error::PT PARAM validity check failed for $f"
              FAILED=1
            fi
            rm -f "${f}_orig_"
          }

          for param_file in \
            Param/PARAM.in.test.OHPT.FLEKS.shocktube \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.4neu.start \
            Param/PARAM.in.test.OHPT.FLEKS.outerhelio.pui.4neu.start; do
            check_pt "$param_file"
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Verify Test Results
        working-directory: SWMF
        run: |
          DIFF_FILES=(
            test20_ohpt.diff
            test21_ohpt.diff
            test22_ohpt.diff
          )

          test_name_for() {
            case "$1" in
              *_ohpt.diff) echo "${1%_ohpt.diff}" ;;
              *)           echo "${1%.diff}" ;;
            esac
          }

          FAILED=0
          PASSED_COUNT=0
          FAILED_COUNT=0
          FAILED_ROWS=""
          ALL_ROWS=""
          DIFF_DETAILS=""

          for diff_file in "${DIFF_FILES[@]}"; do
            test_name=$(test_name_for "$diff_file")
            if [ ! -f "$diff_file" ]; then
              echo "::error::Test verification failed! Expected diff file $diff_file was not generated."
              FAILED=1
              FAILED_COUNT=$((FAILED_COUNT + 1))
              reason="Expected diff file not generated"
              FAILED_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
            elif [ -s "$diff_file" ]; then
              echo "::error::Test verification failed! Non-zero diff detected in $diff_file"
              cat "$diff_file"
              FAILED=1
              FAILED_COUNT=$((FAILED_COUNT + 1))
              last_line=$(tail -n 1 "$diff_file" | tr -d '\r')
              if [[ "$last_line" =~ _compile\.\.\.$ ]] || [[ "$last_line" =~ _rundir\.\.\.$ ]] || [[ "$last_line" =~ _run\.\.\.$ ]] || [[ "$last_line" =~ _check\.\.\.$ ]]; then
                reason="Aborted during \`${last_line%...}\`"
              else
                err_summary=$(grep -E "ERROR in DiffNum\.pl:" "$diff_file" | sed 's/ERROR in DiffNum\.pl: //' | paste -sd "; " - || true)
                if [ -n "$err_summary" ]; then
                  reason="$err_summary"
                else
                  reason="Non-zero diff ($(wc -l < "$diff_file" | tr -d ' ') lines)"
                fi
              fi
              FAILED_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🔴 **FAILED** | $reason |\n"
              DIFF_DETAILS+="<details><summary>📄 <code>$diff_file</code> ($test_name)</summary>\n\n\`\`\`diff\n$(cat "$diff_file")\n\`\`\`\n\n</details>\n\n"
            else
              echo "Test verification successful for $diff_file! Diff is empty."
              PASSED_COUNT=$((PASSED_COUNT + 1))
              ALL_ROWS+="| \`$test_name\` | \`$diff_file\` | 🟢 **PASSED** | - |\n"
            fi
          done

          TOTAL_COUNT=${#DIFF_FILES[@]}
          {
            echo "### 🧪 SWMF OH-PT Integration Test Results"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "✅ **All $TOTAL_COUNT checks passed!**"
            else
              echo "❌ **$FAILED_COUNT of $TOTAL_COUNT check(s) failed** (**$PASSED_COUNT** passed, **$FAILED_COUNT** failed)"
              echo ""
              echo "#### 🔴 Failed Checks"
              echo ""
              echo "| Test | Diff File | Status | Details |"
              echo "| :--- | :--- | :--- | :--- |"
              printf '%b' "$FAILED_ROWS"
              echo ""
              if [ -n "$DIFF_DETAILS" ]; then
                echo "#### 🔍 Diff Output for Failed Checks"
                echo ""
                printf '%b' "$DIFF_DETAILS"
              fi
            fi
            echo ""
            echo "<details>"
            echo "<summary>📋 <b>Full Check Results ($TOTAL_COUNT checks)</b></summary>"
            echo ""
            echo "| Test | Diff File | Status | Details |"
            echo "| :--- | :--- | :--- | :--- |"
            printf '%b' "$ALL_ROWS"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

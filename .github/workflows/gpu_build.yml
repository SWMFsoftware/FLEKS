name: GPU Build Check

on:
  push:
    branches: [ "master", "feat/gpu-port" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'srcInterface/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/gpu_build.yml'
      - '.github/actions/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'srcInterface/**'
      - 'userfiles/**'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/workflows/gpu_build.yml'
      - '.github/actions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-compile-check:
    name: Compile with CUDA (nvcc)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Install CUDA Toolkit
        run: |
          set -euo pipefail
          UBUNTU_VER=$(lsb_release -sr | tr -d '.')
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb" -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/cuda-ubuntu${UBUNTU_VER}-x86_64.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0" || sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 \
            cuda-cudart-dev-12-6 \
            cuda-driver-dev-12-6 \
            cuda-cccl-12-6 \
            libcurand-dev-12-6 \
            libcusparse-dev-12-6
          sudo ln -sfn /usr/local/cuda-12.6 /usr/local/cuda
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 3d-cuda-sm80
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'false'

      - name: Compile FLEKS with CUDA (nvcc)
        working-directory: SWMF/PC/FLEKS
        shell: bash
        run: |
          set -euo pipefail

          # Target sm_80 (A100) for fast single-arch compile during CI
          echo "=== Configuring FLEKS with CUDA ==="
          ./Config.pl -cuda=80 -amrex3d -lev=2 -u=Exo

          echo "=== Compiling FLEKS EXE ==="
          LOG="gpu_build.log"
          set +e
          make EXE -j$(nproc) > "$LOG" 2>&1
          BUILD_STATUS=$?
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::FLEKS CUDA compilation failed."
            cat "$LOG"
            {
              echo "### ❌ GPU Compile Check Failed"
              echo ""
              echo "Compilation with \`nvcc\` failed:"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Surface any unexpected compiler warnings (excluding make directory noise and known nvlink notices)
          WARN_PATTERN='(warning:|Warning:|[:][0-9]+[:][0-9]*: warning:)'
          MAKE_NOISE_PATTERN='make(\[[0-9]+\])?: (warning: )?(jobserver unavailable|Entering directory|Leaving directory)|nvlink warning : Stack size'
          grep -E -i "$WARN_PATTERN" "$LOG" | grep -E -iv "$MAKE_NOISE_PATTERN" > gpu_warnings.txt || true

          if [ -s gpu_warnings.txt ]; then
            echo "::warning::Compiler warnings detected during GPU build:"
            cat gpu_warnings.txt
            {
              echo "### ⚠️ GPU Build Warnings"
              echo ""
              echo '```'
              cat gpu_warnings.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "=== GPU Build Succeeded ==="
          {
            echo "### ✅ GPU Compile Check"
            echo ""
            echo "Successfully compiled FLEKS with CUDA support (\`nvcc\`, \`sm_80\`) against AMReX 3D."
            echo "- Relocatable device code, lambda capture checks (\`--Werror ext-lambda-captures-this\`), and device linking passed."
          } >> "$GITHUB_STEP_SUMMARY"

name: Standalone Test

on:
  pull_request:
    branches: [ "master" ]
    # Allowlist: a blacklist made every new path (docs, tooling, other
    # workflows) trigger the full 2D/3D test matrix.
    paths:
      - 'src/**'
      - 'include/**'
      - 'srcInterface/**'
      - 'userfiles/**'
      - 'tests/**'
      - '!tests/performance/**'
      - '!tests/validate_performance.py'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/actions/**'
      - '.github/workflows/standalone_test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Standalone job building against the 3D AMReX library (-amrex3d).
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (3D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 3d
          cache-key: fleks-standalone-v3
          serial-summary: summary_serial.md
          parallel-summary: summary_parallel.md
          summary-title: Standalone FLEKS Test Results
          post-pr-comment: 'true'

  # Standalone job building against the true-2D AMReX library (-amrex2d).
  build-and-test-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (2D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 2d
          cache-key: fleks-standalone-2d-v3
          serial-summary: summary_2d_serial.md
          parallel-summary: summary_2d_parallel.md
          summary-title: Standalone FLEKS 2D AMReX Test Results
          post-pr-comment: 'false'

  # Compiler warning check against the true-2D AMReX library (-amrex2d).
  # This is a separate job on purpose: it compiles FLEKS unoptimized
  # (-debug -O0), so it must never share a workspace or AMReX cache
  # (amrex-cache-suffix: 2d-debug) with the job that builds the optimized
  # executable used to run the tests.
  warning-check-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d-debug
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'false'

      - name: Check for compiler warnings (2D, -debug -O0)
        uses: ./.github/actions/warning-check
        with:
          amrex-dim: 2d
          warning-summary: warning_check_2d.md
          summary-title: FLEKS 2D AMReX Compiler Warning Check

  # Validate all standalone FLEKS PARAM.in* test files against PARAM.XML.
  # Uses CheckParam.pl -S (standalone mode), the same approach as
  # BATSRUS/TestParam.pl, but without the SWMF component map overhead.
  # This is a lightweight job: no AMReX build or FLEKS compilation required.
  param-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          # No AMReX build needed for param check; use a minimal suffix so we
          # don't evict any real build cache.
          amrex-cache-suffix: 3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'false'

      - name: Validate standalone FLEKS PARAM files (CheckParam.pl)
        working-directory: SWMF/PC/FLEKS
        run: |
          # Validate every standalone PARAM.in* file in tests/ against
          # FLEKS's own PARAM.XML using CheckParam.pl in standalone mode (-S).
          # This mirrors what BATSRUS/TestParam.pl does (CheckParam.pl -S -c=GM),
          # but for FLEKS: the -c flag is omitted because FLEKS PARAM.XML does
          # not segment by component (all commands are in the root context).
          CHECK_SCRIPT="share/Scripts/CheckParam.pl"
          XML_FILE="PARAM.XML"

          FAILED=0
          while IFS= read -r -d '' param_file; do
            echo "Checking $param_file ..."
            if ! "$CHECK_SCRIPT" -S -x="$XML_FILE" "$param_file" 2>&1; then
              echo "::error::PARAM validity check failed for $param_file"
              FAILED=1
            fi
          done < <(find tests -name "PARAM.in*" \
                    -not -path "tests/performance/*" \
                    -print0 | sort -z)

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

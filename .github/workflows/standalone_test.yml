name: Standalone Test

on:
  pull_request:
    branches: [ "master" ]
    # Allowlist: a blacklist made every new path (docs, tooling, other
    # workflows) trigger the full 2D/3D test matrix.
    paths:
      - 'src/**'
      - 'include/**'
      - 'srcInterface/**'
      - 'userfiles/**'
      - 'tests/**'
      - '!tests/performance/**'
      - '!tests/validate_performance.py'
      - 'Config.pl'
      - 'Makefile'
      - 'Makefile.*'
      - '.github/actions/**'
      - '.github/workflows/standalone_test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Standalone job building against the 3D AMReX library (-amrex3d).
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (3D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 3d
          cache-key: fleks-standalone-v3
          serial-summary: summary_serial.md
          parallel-summary: summary_parallel.md
          summary-title: Standalone FLEKS Test Results
          post-pr-comment: 'true'

  # Standalone job building against the true-2D AMReX library (-amrex2d).
  build-and-test-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (2D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 2d
          cache-key: fleks-standalone-2d-v3
          serial-summary: summary_2d_serial.md
          parallel-summary: summary_2d_parallel.md
          summary-title: Standalone FLEKS 2D AMReX Test Results
          post-pr-comment: 'false'

  # Compiler warning check against the true-2D AMReX library (-amrex2d).
  # This is a separate job on purpose: it compiles FLEKS unoptimized
  # (-debug -O0), so it must never share a workspace or AMReX cache
  # (amrex-cache-suffix: 2d-debug) with the job that builds the optimized
  # executable used to run the tests.
  warning-check-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d-debug
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'false'

      - name: Check for compiler warnings (2D, -debug -O0)
        uses: ./.github/actions/warning-check
        with:
          amrex-dim: 2d
          warning-summary: warning_check_2d.md
          summary-title: FLEKS 2D AMReX Compiler Warning Check

  # Validate the standalone FLEKS PARAM decks against PARAM.XML with
  # share/Scripts/CheckParam.pl in standalone mode (-S), the same script that
  # BATSRUS/TestParam.pl calls. This is a lightweight job: no AMReX build or
  # FLEKS compilation is required.
  param-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          # No AMReX build is needed for the PARAM check; reuse the 3d cache
          # prefix so we do not evict any real build cache.
          amrex-cache-suffix: 3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'false'

      - name: Validate standalone FLEKS PARAM files (CheckParam.pl)
        working-directory: SWMF/PC/FLEKS
        run: |
          # CheckParam.pl needs share/Scripts (it pulls XmlRead.pl from there).
          # In this job FLEKS sits inside the SWMF tree and has no local share/,
          # so fall back to the SWMF level copy exactly like BATSRUS/TestParam.pl
          # does ("../../$CheckParamScript").
          CHECK_SCRIPT="share/Scripts/CheckParam.pl"
          [ -x "$CHECK_SCRIPT" ] || CHECK_SCRIPT="../../share/Scripts/CheckParam.pl"
          if [ ! -x "$CHECK_SCRIPT" ]; then
            echo "::error::Could not find CheckParam.pl in share/Scripts or ../../share/Scripts"
            exit 1
          fi

          # $_Value{nDim} drives the per-dimension <for> loops of PARAM.XML
          # (#FIELDBOXBOUNDARY, #PARTICLEBOXBOUNDARY, ...). Every deck checked
          # here spells out all three components, so check them with nDim=3
          # instead of the dimension of whatever AMReX happens to be cached.
          CHECK_NDIM=3

          # CheckParam.pl is positional: each documented parameter of a used
          # command needs its own line, so these decks list even the parameters
          # that fall back to their documented default. The other test decks
          # still rely on the defaults and are therefore not checked yet; extend
          # the list below when a deck is brought into CheckParam.pl form (see
          # tests/README.md).
          PARAM_FILES=(
            tests/bc_absorb/PARAM.in.fields
            tests/bc_absorb/PARAM.in.particles
            tests/bc_inflow/PARAM.in
            tests/bc_reflecting/PARAM.in.fields
            tests/freestream/PARAM.in.hybrid
            tests/freestream/PARAM.in.hybrid_2d
            tests/lightwave/PARAM.in
            tests/shock/PARAM.in.hybrid
          )

          # Note on the exit status: CheckParam.pl's param_error() flags its
          # error status even while the message itself is suppressed, which
          # happens during the unordered matching of every multi-part "strings"
          # parameter such as #SAVEPLOT's StringPlot. Every deck below therefore
          # exits non-zero without reporting anything, so this step judges
          # CheckParam.pl by its printed output - the same criterion that SWMF's
          # Scripts/TestParam.pl uses - and only a reported error fails the job.
          FAILED=0
          for param_file in "${PARAM_FILES[@]}"; do
            echo "Checking $param_file ..."
            if ! check_output="$("$CHECK_SCRIPT" -S -p=double -s="nDim:$CHECK_NDIM" \
                 -x=PARAM.XML "$param_file" 2>&1)"; then
              :
            fi

            if [ -n "$check_output" ]; then
              printf '%s\n' "$check_output"
              echo "::error::PARAM validity check failed for $param_file"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

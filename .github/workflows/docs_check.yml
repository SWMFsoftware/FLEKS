name: Docs Consistency Check

on:
  push:
    branches: [ "master" ]
    paths:
      - 'AGENT.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'doc/**'
      - '.agents/**'
      - 'PARAM.XML'
      - 'src/Domain.cpp'
      - 'userfiles/ExoSource.h'
      - 'tests/**/README.md'
      - 'tools/check_docs.py'
      - 'tools/check_parameter_registry.py'
      - '.github/workflows/docs_check.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'AGENT.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'doc/**'
      - '.agents/**'
      - 'PARAM.XML'
      - 'src/Domain.cpp'
      - 'userfiles/ExoSource.h'
      - 'tests/**/README.md'
      - 'tools/check_docs.py'
      - 'tools/check_parameter_registry.py'
      - '.github/workflows/docs_check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run docs consistency check
        run: python3 tools/check_docs.py

      - name: Verify parameter registry documentation
        run: python3 tools/check_parameter_registry.py

name: 'Build and test standalone FLEKS'
description: >-
  Configure, build, run, and summarize a standalone FLEKS test against a
  specific AMReX spatial dimension (2D or 3D). Expects the SWMF-nested layout
  from the setup-swmf composite action (FLEKS at SWMF/PC/FLEKS).

  This action always configures the fully optimized release build (-O4
  -nodebug); the executable produced here is the one the tests run with. The
  compiler warning check, which needs an unoptimized (-debug -O0) build, lives
  in the separate warning-check action and must be run as its own job: mixing
  both configurations into one job leaves the object files from whichever
  configuration was compiled last (Makefile.conf is not a prerequisite of the
  objects, so reconfiguring does not trigger a rebuild) and the tests would
  silently run an unoptimized executable.
inputs:
  amrex-dim:
    description: 'AMReX spatial dimension: "2d" or "3d".'
    required: true
  cache-key:
    description: 'Cache key prefix for the standalone FLEKS build.'
    required: true
  jobs:
    description: 'Number of concurrent test worker processes (-j flag).'
    required: false
    default: '2'
  serial-summary:
    description: 'Deprecated: Serial run summary file (serial runs removed from CI).'
    required: false
    default: ''
  parallel-summary:
    description: 'Filename for the test summary (relative to the tests dir).'
    required: true
    default: summary_parallel.md
  summary-title:
    description: 'Markdown heading for the job summary.'
    required: true
  post-pr-comment:
    description: "Whether to post the results as a PR comment ('true'/'false')."
    required: true
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Configure Standalone FLEKS Source
      working-directory: SWMF/PC/FLEKS
      shell: bash
      run: |
        # Link the AMReX library, enable AMR (nLevMax>=2), and build a fully
        # optimized release executable (-O4 -nodebug) for running the tests.
        ./Config.pl -amrex${{ inputs.amrex-dim }} -lev=2 -u=Exo -O4 -nodebug

        # Verify that the AMReX library linked against is indeed an optimized
        # release build (AMREX_DEBUG must not be defined).
        AMREX_CONFIG="../../util/AMREX/InstallDir/include/AMReX_Config.H"
        if [ -f "$AMREX_CONFIG" ] && grep -q "#define AMREX_DEBUG" "$AMREX_CONFIG"; then
          echo "::error::AMReX has AMREX_DEBUG defined! Standalone tests must run against an optimized AMReX library."
          exit 1
        fi

        # Verify that FLEKS Makefile.conf was configured without debug flags.
        if grep -E "^DEBUGC\s*=" Makefile.conf; then
          echo "::error::FLEKS Makefile.conf has DEBUGC enabled! Standalone tests must run with an optimized executable."
          exit 1
        fi

    - name: Cache Standalone Build
      id: cache-standalone
      uses: actions/cache@v5
      with:
        # In the CI, FLEKS is built inside the SWMF tree (not standalone).
        # make PIDL installs PostIDL.exe to the SWMF-level bin directory
        # (SWMF/bin/), not the component-level bin (SWMF/PC/FLEKS/bin/).
        # The test script (validate_tests.py) searches candidate locations
        # and finds PostIDL.exe at SWMF/bin/PostIDL.exe.
        path: |
          SWMF/PC/FLEKS/bin/FLEKS.exe
          SWMF/bin/PostIDL.exe
        key: ${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('SWMF/PC/FLEKS/**/*.cpp', 'SWMF/PC/FLEKS/**/*.h', 'SWMF/PC/FLEKS/**/Makefile*') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key }}-

    - name: Build Standalone FLEKS
      if: steps.cache-standalone.outputs.cache-hit != 'true'
      working-directory: SWMF/PC/FLEKS
      shell: bash
      run: |
        make EXE -j$(nproc)
        make PIDL

    - name: Install Python test dependencies
      shell: bash
      run: |
        # Several validators (reconnection, langmuir, amr_equilibrium, ...)
        # need numpy. Without it validate_tests.py reports them as SKIPPED,
        # which is right for a local run but would hide them in CI, so install
        # it here and fail this step if it cannot be imported. The runner's
        # system python3 is externally managed (PEP 668), hence the distro
        # package rather than pip.
        sudo apt-get update
        sudo apt-get install -y python3-numpy
        python3 -c "import numpy; print('numpy', numpy.__version__)"

    - name: Run Standalone FLEKS Tests (Parallel, 2 Procs)
      id: test-parallel
      working-directory: SWMF/PC/FLEKS/tests
      shell: bash
      run: |
        ldd ../bin/FLEKS.exe
        python3 validate_tests.py -n 2 -j ${{ inputs.jobs }} --summary-file ${{ inputs.parallel-summary }} --summary-title "${{ inputs.summary-title }}"

    - name: Write Job Summary
      if: always()
      shell: bash
      run: |
        if [ -f SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }} ]; then
          cat SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }} >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post PR Comment
      if: always() && inputs.post-pr-comment == 'true' && github.event.pull_request && (github.event_name == 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const parallelPath = 'SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }}';
          let body = '';

          if (fs.existsSync(parallelPath)) {
            body = fs.readFileSync(parallelPath, 'utf8') + '\n';
          }

          if (body) {
            // 1. List existing comments to find one matching our summary prefix
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const prComment = comments.find(comment =>
              comment.body.includes('### 🧪 ${{ inputs.summary-title }}')
            );

            if (prComment) {
              // 2. Update existing comment in place
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prComment.id,
                body: body
              });
              console.log('Successfully updated existing PR comment with correctness results.');
            } else {
              // 3. Create a new comment if none exists
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Successfully created new PR comment with correctness results.');
            }
          }

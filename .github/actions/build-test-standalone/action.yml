name: 'Build and test standalone FLEKS'
description: >-
  Configure, build, run, and summarize a standalone FLEKS test against a
  specific AMReX spatial dimension (2D or 3D). Expects the SWMF-nested layout
  from the setup-swmf composite action (FLEKS at SWMF/PC/FLEKS).
inputs:
  amrex-dim:
    description: 'AMReX spatial dimension: "2d" or "3d".'
    required: true
  cache-key:
    description: 'Cache key prefix for the standalone FLEKS build.'
    required: true
  serial-summary:
    description: 'Filename for the serial test summary (relative to the tests dir).'
    required: true
    default: summary_serial.md
  parallel-summary:
    description: 'Filename for the parallel test summary (relative to the tests dir).'
    required: true
    default: summary_parallel.md
  summary-title:
    description: 'Markdown heading for the job summary.'
    required: true
  post-pr-comment:
    description: "Whether to post the results as a PR comment ('true'/'false')."
    required: true
    default: 'false'
  enable-debug-warning-check:
    description: >-
      If 'true', additionally compile FLEKS in debug mode (-debug -O0) purely to
      surface compiler warnings. This build is NOT used to run tests. The step
      fails if any compiler warning is emitted during this compilation.
    required: false
    default: 'false'
  debug-warning-summary:
    description: 'Filename for the debug-build warning check summary (relative to the tests dir).'
    required: false
    default: debug_warning_check.md
runs:
  using: 'composite'
  steps:
    - name: Debug-build warning check (compile-only, -debug -O0)
      if: inputs.enable-debug-warning-check == 'true'
      working-directory: SWMF/PC/FLEKS
      shell: bash
      run: |
        set -euo pipefail

        # Configure a debug, unoptimized build. This rebuilds the whole tree
        # with no optimization so the compiler emits every warning it can.
        ./Config.pl -amrex${{ inputs.amrex-dim }} -lev=2 -u=Exo -debug -O0

        # Compile, capturing ALL output (both stdout and stderr) to a log file.
        # We deliberately do NOT run any tests with this build.
        LOG="debug_build_warnings.log"
        make EXE -j$(nproc) > "$LOG" 2>&1 || {
          echo "::error::Debug build (-debug -O0) failed to compile."
          cat "$LOG"
          exit 1
        }

        # Detect compiler warnings. Match common warning prefixes emitted by
        # g++, clang++, and gfortran so this is compiler-agnostic.
        WARN_PATTERN='(warning:|Warning:|[:][0-9]+[:][0-9]*: warning:|remark #|converting .* to .* changes value|Possible change of value in conversion)'
        if grep -E -i "$WARN_PATTERN" "$LOG" > debug_warnings.txt; then
          echo "::error::Compiler warnings detected during debug build (-debug -O0):"
          cat debug_warnings.txt
          {
            echo "### ⚠️ Debug-build compiler warnings"
            echo ""
            echo "The \`-debug -O0\` warning check found the following warnings:"
            echo ""
            echo '```'
            cat debug_warnings.txt
            echo '```'
          } > "tests/${{ inputs.debug-warning-summary }}"
          # Restore the optimized configuration so the downstream test build
          # (and its cache key) is unaffected by the debug configure.
          ./Config.pl -amrex${{ inputs.amrex-dim }} -lev=2 -u=Exo
          exit 1
        fi

        echo "Debug-build warning check passed: no compiler warnings."
        {
          echo "### ✅ Debug-build warning check"
          echo ""
          echo "Compiled with \`-debug -O0\`; no compiler warnings were detected."
        } > "tests/${{ inputs.debug-warning-summary }}"

        # Restore the optimized configuration so the downstream test build
        # (and its cache key) is unaffected by the debug configure.
        ./Config.pl -amrex${{ inputs.amrex-dim }} -lev=2 -u=Exo

    - name: Configure Standalone FLEKS Source
      working-directory: SWMF/PC/FLEKS
      shell: bash
      run: |
        # Link the AMReX library and enable AMR (nLevMax>=2).
        ./Config.pl -amrex${{ inputs.amrex-dim }} -lev=2 -u=Exo

    - name: Cache Standalone Build
      id: cache-standalone
      uses: actions/cache@v5
      with:
        # In the CI, FLEKS is built inside the SWMF tree (not standalone).
        # make PIDL installs PostIDL.exe to the SWMF-level bin directory
        # (SWMF/bin/), not the component-level bin (SWMF/PC/FLEKS/bin/).
        # The test script (validate_tests.py) searches candidate locations
        # and finds PostIDL.exe at SWMF/bin/PostIDL.exe.
        path: |
          SWMF/PC/FLEKS/bin/FLEKS.exe
          SWMF/bin/PostIDL.exe
        key: ${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('SWMF/PC/FLEKS/**/*.cpp', 'SWMF/PC/FLEKS/**/*.h', 'SWMF/PC/FLEKS/**/Makefile*') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key }}-

    - name: Build Standalone FLEKS
      if: steps.cache-standalone.outputs.cache-hit != 'true'
      working-directory: SWMF/PC/FLEKS
      shell: bash
      run: |
        make EXE -j$(nproc)
        make PIDL

    - name: Run Standalone FLEKS Tests (Serial)
      id: test-serial
      working-directory: SWMF/PC/FLEKS/tests
      shell: bash
      run: |
        ldd ../bin/FLEKS.exe
        python3 validate_tests.py --summary-file ${{ inputs.serial-summary }}

    - name: Run Standalone FLEKS Tests (Parallel, 2 Procs)
      id: test-parallel
      if: always()
      working-directory: SWMF/PC/FLEKS/tests
      shell: bash
      run: |
        python3 validate_tests.py -n 2 --summary-file ${{ inputs.parallel-summary }}

    - name: Write Job Summary
      if: always()
      shell: bash
      run: |
        {
          echo "### 🧪 ${{ inputs.summary-title }}"
          echo ""
          if [ -f SWMF/PC/FLEKS/tests/${{ inputs.serial-summary }} ]; then
            echo "#### Serial (1 proc)"
            cat SWMF/PC/FLEKS/tests/${{ inputs.serial-summary }}
            echo ""
          fi
          if [ -f SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }} ]; then
            echo "#### Parallel (2 procs)"
            cat SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }}
            echo ""
          fi
          if [ -f SWMF/PC/FLEKS/tests/${{ inputs.debug-warning-summary }} ]; then
            echo "#### Debug-build warning check (-debug -O0)"
            cat SWMF/PC/FLEKS/tests/${{ inputs.debug-warning-summary }}
            echo ""
          fi
        } >> $GITHUB_STEP_SUMMARY

    - name: Post PR Comment
      if: always() && inputs.post-pr-comment == 'true' && github.event.pull_request && (github.event_name == 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const serialPath = 'SWMF/PC/FLEKS/tests/${{ inputs.serial-summary }}';
          const parallelPath = 'SWMF/PC/FLEKS/tests/${{ inputs.parallel-summary }}';
          const debugWarnPath = 'SWMF/PC/FLEKS/tests/${{ inputs.debug-warning-summary }}';
          let body = '';

          if (fs.existsSync(serialPath) || fs.existsSync(parallelPath) || fs.existsSync(debugWarnPath)) {
            body += '### 🧪 ${{ inputs.summary-title }}\n\n';

            if (fs.existsSync(serialPath)) {
              body += fs.readFileSync(serialPath, 'utf8') + '\n';
            }
            if (fs.existsSync(parallelPath)) {
              body += fs.readFileSync(parallelPath, 'utf8') + '\n';
            }
            if (fs.existsSync(debugWarnPath)) {
              body += fs.readFileSync(debugWarnPath, 'utf8') + '\n';
            }
          }

          if (body) {
            // 1. List existing comments to find one matching our summary prefix
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const prComment = comments.find(comment =>
              comment.body.includes('### 🧪 ${{ inputs.summary-title }}')
            );

            if (prComment) {
              // 2. Update existing comment in place
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prComment.id,
                body: body
              });
              console.log('Successfully updated existing PR comment with correctness results.');
            } else {
              // 3. Create a new comment if none exists
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Successfully created new PR comment with correctness results.');
            }
          }
